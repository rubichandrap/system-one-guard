name: system-one-guard
version: 0.5.0
description: Jev (TypeSafe System One) gates state-changing tool calls and done-checks, nothing else
author: Rubi Chandraputra
license: MIT
homepage: https://github.com/rubichandrap/system-one-guard
# manifest_version omitted: the current Hermes installer caps at 1; the loader parses config_schema either way
tags: [guardrail, typesafe, jev]
provides_hooks:
  - pre_llm_call   # records the turn's user message only; makes no Jev call
  - pre_tool_call
  - pre_verify
requires_env:
  - name: TYPESAFE_API_KEY
    description: TypeSafe API key for Jev (System One)
    url: https://typesafe.ai
    secret: true
config_schema:
  timeout: {type: float, default: 8, description: HTTP timeout in seconds for Jev calls}
  approve_at: {type: float, default: 0.7, description: Risk probability that escalates a tool call to human approval; also the bar for the done-check's stop question}
  block_at: {type: float, default: 0.97, description: Risk probability at which the ask becomes urgent and names the exact action. Still an approval prompt, never a veto: the gate has no power to deny an action the user wants. Config name kept for compatibility; read as urgent_at in code}
  verify_at: {type: float, default: 0.7, description: Nudge the agent to finish when p(complete) falls below this}
  code_chars: {type: int, default: 8000, description: Edited-file text sent with the done-check, in characters}
  max_state_chars: {type: int, default: 12000, description: State sent to Jev is clipped to this many characters}
